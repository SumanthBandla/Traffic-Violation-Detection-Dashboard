# Render blueprint — Traffic Violation Detection backend
# Deploy via: New + -> Blueprint (select this repo), or the Render dashboard.
# The FastAPI backend (WebSockets + Postgres + evidence disk) runs here because
# Vercel serverless cannot host WebSockets or persistent storage.

services:
  - type: web
    name: traffic-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://localhost:3000","http://localhost:4173","https://traffic-violation-dashboard.vercel.app"]'
      - key: AI_MODE
        value: demo
      - key: EVIDENCE_DIR
        value: /var/data/evidence
      - key: REDIS_URL
        value: ""
    disk:
      name: evidence
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: traffic-db
    plan: free
    databaseName: traffic_db
    user: traffic
