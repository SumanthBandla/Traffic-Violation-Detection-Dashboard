version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: traffic_db
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic123
      POSTGRES_DB: traffic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: traffic_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://traffic:traffic123@db:5432/traffic_db
      REDIS_URL: redis://redis:6379/0
      AI_MODE: demo
      EVIDENCE_DIR: /app/storage/evidence
    volumes:
      - evidence:/app/storage/evidence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python -m app.scripts.seed_data --force &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: traffic_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  evidence:

